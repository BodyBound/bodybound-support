name: Monthly Credit Refresh

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions UI

jobs:
  refresh-credits:
    runs-on: ubuntu-latest
    steps:
      - name: Sanity-check BACKEND_URL points at production FastAPI
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then
            echo "ERROR: BACKEND_URL secret is empty."
            exit 1
          fi

          HEALTH_RESPONSE=$(curl -s -w "\n%{http_code}" "${{ secrets.BACKEND_URL }}/api/health")
          HEALTH_CODE=$(echo "$HEALTH_RESPONSE" | tail -1)
          HEALTH_BODY=$(echo "$HEALTH_RESPONSE" | sed '$d')

          echo "Health endpoint: ${{ secrets.BACKEND_URL }}/api/health"
          echo "Health status:   $HEALTH_CODE"
          echo "Health body:     $HEALTH_BODY"

          if [ "$HEALTH_CODE" != "200" ]; then
            echo "ERROR: BACKEND_URL is not pointing at the production FastAPI backend."
            echo "Expected 200 from /api/health, got $HEALTH_CODE."
            exit 1
          fi

          if ! echo "$HEALTH_BODY" | grep -q '"status":"healthy"'; then
            echo "ERROR: BACKEND_URL is not pointing at the production FastAPI backend."
            echo "Health endpoint returned 200 but body did not contain the expected 'healthy' status payload."
            echo "This usually means BACKEND_URL is routed to a different host (frontend/static/edge) instead of the FastAPI API."
            exit 1
          fi

          echo "OK: BACKEND_URL is healthy and pointing at the FastAPI backend."

      - name: Trigger monthly credit refresh
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.BACKEND_URL }}/api/tasks/refresh-credits" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Credit refresh failed with status $HTTP_CODE"
            exit 1
          fi

          REFRESHED=$(echo "$BODY" | python3 -c "import sys,json;d=json.loads(sys.stdin.read());print(d.get('refreshed',0))")
          CHECKED=$(echo "$BODY" | python3 -c "import sys,json;d=json.loads(sys.stdin.read());print(d.get('checked',0))")
          echo "SUCCESS: Refreshed $REFRESHED / $CHECKED subscriptions"
